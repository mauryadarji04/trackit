# SQL Server for local development.   docker compose up -d
# Then run the scripts in /Database and start the web app (see README).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trackit-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TrackIt_Dev#2026"
    ports:
      - "1433:1433"
    volumes:
      - trackit-data:/var/opt/mssql

volumes:
  trackit-data:
